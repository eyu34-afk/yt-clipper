<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyobel's YT Clipper</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #166534, #15803d, #ca8a04);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: rgba(20, 83, 45, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(250, 204, 21, 0.3);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.5s ease;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            transform: scale(0.95);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 15px;
            color: #facc15;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        p {
            color: #fef08a;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
            font-weight: 500;
        }

        .btn-yes {
            background: linear-gradient(135deg, #eab308, #16a34a);
            color: #ffffff;
            border: none;
            padding: 14px 36px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(234, 179, 8, 0.5);
        }

        .btn-yes:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 6px 25px rgba(34, 197, 94, 0.7);
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #fef08a;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(10, 40, 20, 0.7);
            border: 1px solid rgba(250, 204, 21, 0.4);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #facc15;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6);
        }

        #loading {
            margin-top: 20px;
            font-size: 14px;
            color: #fef08a;
            display: none;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #facc15;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- FAN GATE OVERLAY -->
    <div id="fanGate" class="container">
        <h1>👋 Hey You! 🫵</h1>
        <p>Are you *actually* Eyobel's number one fan, or are you just clicking buttons to steal his clips? 😏🔥</p>
        <button class="btn-yes" onclick="unlockClipper()">Yes obviously I am fan 😎🔥</button>
    </div>

    <!-- MAIN CLIPPER UI (Hidden Initially) -->
    <div id="clipperApp" class="container hidden">
        <h1>⚡ Eyobel's YT Clipper Pro 🚀</h1>
        <p>Drop your link below and let the magic happen! ✨🎯</p>
        
        <form id="clipForm">
            <div class="form-group">
                <label>🔗 YouTube URL (Standard or Short)</label>
                <input type="text" id="url" name="url" placeholder="https://youtube.com/shorts/..." required>
            </div>
            <div class="form-group">
                <label>⏱️ Start Time (HH:MM:SS)</label>
                <input type="text" id="start_time" name="start_time" value="00:00:00" required>
            </div>
            <div class="form-group">
                <label>⏳ End Time (HH:MM:SS)</label>
                <input type="text" id="end_time" name="end_time" value="00:00:30" required>
            </div>
            <button type="submit" class="btn-submit">✂️ Generate Clip Now 🔥</button>
        </form>

        <div id="loading">
            <span class="spinner"></span> Cooking up your clip... Hang tight! 🧑‍🍳🍿
        </div>
    </div>

    <script>
        function unlockClipper() {
            const fanGate = document.getElementById('fanGate');
            const clipperApp = document.getElementById('clipperApp');

            fanGate.style.opacity = '0';
            fanGate.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                fanGate.classList.add('hidden');
                clipperApp.classList.remove('hidden');
                clipperApp.style.opacity = '0';
                clipperApp.style.transform = 'scale(0.95)';
                
                setTimeout(() => {
                    clipperApp.style.transition = 'all 0.5s ease';
                    clipperApp.style.opacity = '1';
                    clipperApp.style.transform = 'scale(1)';
                }, 50);
            }, 300);
        }

        document.getElementById('clipForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            const formData = new FormData();
            formData.append('url', document.getElementById('url').value);
            formData.append('start_time', document.getElementById('start_time').value);
            formData.append('end_time', document.getElementById('end_time').value);

            try {
                const response = await fetch('/clip', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = 'output_clip.mp4';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } else {
                    const data = await response.json();
                    alert('Error: ' + (data.error || 'Failed to process clip'));
                }
            } catch (err) {
                alert('An error occurred during request.');
            } finally {
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
